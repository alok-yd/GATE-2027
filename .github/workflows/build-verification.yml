name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check all application sections
        run: npx tsc --noEmit

      - name: Validate AI Mentor gateway syntax
        run: node --check server/ai-gateway.mjs

      - name: Build ACHIEVER
        run: npm run build
