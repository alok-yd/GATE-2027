name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix --no-fund --no-progress || true

      - name: Capture updated lockfile and audit report
        run: |
          npm audit --json > npm-audit-after.json || true
          mkdir -p remediation-artifact
          cp package-lock.json remediation-artifact/package-lock.json
          cp npm-audit-after.json remediation-artifact/npm-audit-after.json

      - name: Upload dependency remediation artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation
          path: remediation-artifact/

      - name: Type-check all application sections
        run: npx tsc --noEmit

      - name: Validate AI Mentor gateway syntax
        run: node --check server/ai-gateway.mjs

      - name: Build ACHIEVER
        run: npm run build
