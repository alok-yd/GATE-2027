name: Temporary dependency remediation
on:
  push:
    branches:
      - feat/secure-multi-user-authentication
permissions:
  contents: read
jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix --no-fund --no-progress || true
      - name: Capture final audit report and lockfile
        run: |
          npm audit --json > npm-audit-after.json || true
          mkdir -p remediation-artifact
          cp package-lock.json remediation-artifact/package-lock.json
          cp npm-audit-after.json remediation-artifact/npm-audit-after.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation
          path: remediation-artifact/
      - name: Verify production build
        run: npm run build
      - name: Verify TypeScript
        run: npx tsc --noEmit
